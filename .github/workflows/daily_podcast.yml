name: Týždenný AI Podcast

on:
  # Každý pondelok o 8:00 v Bratislave. GitHub cron beží len v UTC, preto sú dve
  # spúšťania (6:00 UTC = 8:00 letný čas, 7:00 UTC = 8:00 zimný čas) a job
  # "check-time" prepustí len to, ktoré zodpovedá 8:00 podľa Europe/Bratislava.
  schedule:
    - cron: "0 6 * * 1"
    - cron: "0 7 * * 1"

  # Alebo spusti manuálne cez GitHub UI (Actions → Run workflow)
  workflow_dispatch:

permissions:
  contents: write   # Potrebné pre commit RSS + vytvorenie Release
  pages: write
  id-token: write

jobs:
  # ─── Zisti, či je v Bratislave práve hodina spustenia (8:xx) ──
  check-time:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Skontroluj lokálny čas
        id: gate
        run: |
          HOUR=$(TZ=Europe/Bratislava date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Lokálna hodina v Bratislave je $HOUR, nie 08 – preskakujem."
          fi

  generate-podcast:
    needs: check-time
    if: needs.check-time.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      # ─── Stiahni repo ───────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Python ─────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Inštaluj závislosti
        run: |
          pip install -r requirements.txt

      # ─── Spusti generátor ───────────────────────────────────
      - name: Generuj podcast
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: python ai_podcast_generator.py

      # ─── Získaj dnešný dátum pre Release tag ────────────────
      - name: Nastav dátum
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # ─── Vytvor GitHub Release a nahraj MP3 ─────────────────
      - name: Nahraj MP3 ako GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.DATE }}
          name: "Kolby AI Podcast – ${{ steps.date.outputs.DATE }}"
          files: output/kolby-ai-${{ steps.date.outputs.DATE }}.mp3
          body: |
            Týždenná epizóda Kolby AI Podcast.
            Automaticky vygenerovaná ${{ steps.date.outputs.DATE }}.

      # ─── Commitni RSS feed na GitHub Pages ──────────────────
      - name: Commitni RSS feed
        run: |
          git config user.name "AI Podcast Bot"
          git config user.email "bot@ai-podcast.local"
          git add docs/feed.xml docs/episodes.json docs/used_articles.json
          git diff --staged --quiet || git commit -m "😙️ Epizóda ${{ steps.date.outputs.DATE }}"
          git push
