name: Týždenný AI Podcast

on:
  # Každý pondelok ráno. Dve spúšťania pre letný/zimný čas; job "check-time"
  # prepustí len prvé, ktoré nájde dnes ešte nevytvorenú epizódu.
  schedule:
    - cron: "0 6 * * 1"
    - cron: "0 7 * * 1"

  # Alebo spusti manuálne cez GitHub UI (Actions → Run workflow)
  workflow_dispatch:

permissions:
  contents: write   # Potrebné pre commit RSS + vytvorenie Release
  pages: write
  id-token: write

jobs:
  # ─── Zisti, či je v Bratislave práve hodina spustenia (8:xx) ──
  check-time:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: Skontroluj, či dnešná epizóda ešte neexistuje
        id: gate
        run: |
          # GitHub cron mešká (aj o hodiny), preto nehľadáme presnú hodinu,
          # ale len či už dnes (Europe/Bratislava) epizóda vznikla.
          TODAY=$(TZ=Europe/Bratislava date +%F)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git ls-remote --exit-code --tags origin "refs/tags/$TODAY" >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Epizóda $TODAY už existuje – preskakujem."
          fi

  generate-podcast:
    needs: check-time
    if: needs.check-time.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      # ─── Stiahni repo ───────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Python ─────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Inštaluj závislosti
        run: |
          pip install -r requirements.txt

      # ─── Spusti generátor ───────────────────────────────────
      - name: Generuj podcast
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p output
          python ai_podcast_generator.py 2>&1 | tee output/run.log

      # ─── Pri chybe ulož log pre e-mailové upozornenie ───────
      - name: Nahraj log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: output/run.log
          if-no-files-found: ignore
          retention-days: 7

      # ─── Získaj dnešný dátum pre Release tag ────────────────
      - name: Nastav dátum
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # ─── Vytvor GitHub Release a nahraj MP3 ─────────────────
      - name: Nahraj MP3 ako GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.DATE }}
          name: "Kolby AI Podcast – ${{ steps.date.outputs.DATE }}"
          files: output/kolby-ai-${{ steps.date.outputs.DATE }}.mp3
          body: |
            Týždenná epizóda Kolby AI Podcast.
            Automaticky vygenerovaná ${{ steps.date.outputs.DATE }}.

      # ─── Commitni RSS feed na GitHub Pages ──────────────────
      - name: Commitni RSS feed
        run: |
          git config user.name "AI Podcast Bot"
          git config user.email "bot@ai-podcast.local"
          git add docs/feed.xml docs/episodes.json docs/used_articles.json
          git diff --staged --quiet || git commit -m "😙️ Epizóda ${{ steps.date.outputs.DATE }}"
          git push

  # ─── E-mail, ak sa epizóda nevygenerovala ─────────────────
  notify-failure:
    needs: [check-time, generate-podcast]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stiahni log
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: run-log
          path: logs

      - name: Pošli e-mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOG_FILE: logs/run.log
        run: python notify_failure.py
